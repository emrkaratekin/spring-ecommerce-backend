spring:
  application:
    name: ecommerce-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ecommerce_db}
    username: ${DB_USERNAME:ecommerce_user}
    password: ${DB_PASSWORD:ecommerce_pass}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    web:
      pageable:
        max-page-size: 100

server:
  port: 8080
  error:
    include-stacktrace: never

security:
  jwt:
    # Development-only default. In production ALWAYS provide JWT_SECRET as an environment variable.
    secret: ${JWT_SECRET:rUbX/rZnExfbiQSCzPCn5MXmtJ2TE+GrCLmMUFdyqsBCzYsKRsPOajOUL3coeLF4guZ7cl8juJtWq/Vsyh+RmQ==}
    expiration: ${JWT_EXPIRATION:1h}

app:
  admin:
    email: ${ADMIN_EMAIL:admin@ecommerce.local}
    password: ${ADMIN_PASSWORD:Admin12345}
    first-name: System
    last-name: Admin